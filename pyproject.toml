[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-canary"
version = "0.1.0"
description = "Zero-entropy cryptographic canary token injector and detector identifying context leaks and prompt injections"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-injection-canary = "prompt_injection_canary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_injection_canary*"]
